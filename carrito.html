<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tienda Sara | Carrito</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark nav-sara">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">✿ Tienda Sara</a>
        <div>
          <a class="nav-link d-inline text-white" href="index.html">Inicio</a
          ><a class="nav-link d-inline text-white" href="productos.html"
            >Productos</a
          ><a class="nav-link d-inline text-white" href="carrito.html"
            >Carrito
            <span id="count" class="badge bg-light text-dark">0</span></a
          >
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <span class="eyebrow">CASI ES TUYO</span>
      <h1 class="section-title mb-4">Tu carrito de compra</h1>
      <div class="row g-4">
        <div class="col-lg-8">
          <section class="panel p-3">
            <div id="cart-items"></div>
            <a href="productos.html" class="btn btn-outline-dark mt-3"
              >Seguir comprando</a
            >
            <button id="clear" class="btn btn-outline-danger mt-3">
              Vaciar carrito
            </button>
          </section>
        </div>
        <div class="col-lg-4">
          <section class="panel p-4">
            <h2 class="h4">Resumen del pedido</h2>
            <p>Subtotal: <strong id="subtotal">$0.00</strong></p>
            <p>Envío: <strong id="shipping">$0.00</strong></p>
            <hr />
            <p class="fs-5">Total: <strong id="total">$0.00</strong></p>
            <label class="form-label" for="coupon">Cupón de descuento</label>
            <div class="input-group mb-3">
              <input
                id="coupon"
                class="form-control"
                placeholder="SARA10"
              /><button id="apply" class="btn btn-outline-secondary">
                Aplicar
              </button>
            </div>
            <button id="checkout" class="btn btn-sara w-100">
              Proceder al pago
            </button>
            <p id="message" class="small mt-3" role="status">
              Prototipo académico: no procesa pagos reales.
            </p>
          </section>
        </div>
      </div>
    </main>
    <footer class="footer p-4 text-center">© 2026 Tienda Sara</footer>
    <script src="app.js"></script>
  </body>
</html>
