<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tienda Sara | Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar navbar-dark nav-sara">
        <div class="container"><a class="navbar-brand fw-bold" href="index.html">✿ Tienda Sara</a>
            <div><a class="nav-link d-inline text-white" href="index.html">Inicio</a><a
                    class="nav-link d-inline text-white" href="productos.html">Productos</a><a
                    class="nav-link d-inline text-white" href="carrito.html">Carrito <span id="count"
                        class="badge bg-light text-dark">0</span></a></div>
        </div>
    </nav>
    <main class="container py-5"><span class="eyebrow">NUESTRO CATÁLOGO</span>
        <h1 class="section-title">Galería de productos</h1>
        <div class="row my-4 g-3">
            <div class="col-md-6"><label for="search" class="form-label">Buscar producto</label><input id="search"
                    class="form-control" placeholder="Escribe el nombre"></div>
            <div class="col-md-3"><label for="category" class="form-label">Categoría</label><select id="category"
                    class="form-select">
                    <option value="">Todas</option>
                    <option>Electrónica</option>
                    <option>Deportes</option>
                    <option>Ropa</option>
                    <option>Hogar</option>
                </select></div>
            <div class="col-md-3"><label for="sort" class="form-label">Ordenar</label><select id="sort"
                    class="form-select">
                    <option value="">Relevancia</option>
                    <option value="low">Precio menor</option>
                    <option value="high">Precio mayor</option>
                </select></div>
        </div>
        <div id="products" class="row g-4"></div>
        <p id="notice" class="mt-3" role="status"></p>
    </main>
    <footer class="footer p-4 text-center">© 2026 Tienda Sara</footer>
    <script src="app.js"></script>
</body>

</html>
